<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCHRUN 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Cyber HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        .hud-panel {
            background: rgba(5, 5, 15, 0.75);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            padding: 15px;
            pointer-events: auto;
        }

        #top-hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        /* Menu Screen Overlays */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(5, 5, 10, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #ff0055;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            animation: glitch-text 1.5s infinite alternate;
        }

        .cyber-btn {
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: #00ffcc;
            color: #05050a;
            box-shadow: 0 0 25px #00ffcc;
        }

        #game-over-screen {
            display: none;
            border-color: #ff0055;
        }

        #game-over-screen h1 {
            text-shadow: 0 0 20px #ff0055;
            color: #ff0055;
        }

        @keyframes glitch-text {
            0% { transform: skew(0deg); }
            80% { transform: skew(0deg); }
            85% { transform: skew(3deg); opacity: 0.8; }
            90% { transform: skew(-3deg); }
            95% { transform: skew(0deg); }
        }
    </style>
    <!-- Include Three.js 3D Engine Library safely via CDNJS -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Active Gameplay HUD -->
    <div id="hud">
        <div id="top-hud">
            <div class="hud-panel">LOOT EXTRACTED: <span id="loot-count">0</span> / 5</div>
            <div class="hud-panel">PORTAL TIME: <span id="timer">30</span>s</div>
        </div>
    </div>

    <!-- Main Start Screen Menu -->
    <div id="start-screen" class="screen-overlay">
        <h1>GLITCHRUN 3D</h1>
        <button id="startButton" class="cyber-btn">Initialize System</button>
    </div>

    <!-- Game Over / Win Screen Menu -->
    <div id="game-over-screen" class="screen-overlay">
        <h1 id="end-title">SYSTEM FAIL</h1>
        <p id="end-status" style="font-size: 1.2rem; margin-bottom: 30px;"></p>
        <button id="restartButton" class="cyber-btn">Reboot Sequence</button>
    </div>

    <!-- Main Game Logic Execution -->
    <script src="game.js"></script>
</body>
</html>
